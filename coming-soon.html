<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Abdul Azim</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #60a5fa;
            --primary-color-rgb: 96, 165, 250;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --bg-color: #0f172a;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .coming-soon {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
        }

        .coming-soon-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(var(--primary-color-rgb), 0.1);
            padding: 3rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .coming-soon-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-family: 'Outfit', sans-serif;
        }

        .coming-soon-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: rgba(var(--primary-color-rgb), 0.1);
            border: 1px solid rgba(var(--primary-color-rgb), 0.2);
            border-radius: 12px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(var(--primary-color-rgb), 0.2);
            transform: translateY(-2px);
            color: var(--primary-color);
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: rgba(var(--primary-color-rgb), 0.3);
            top: -150px;
            right: -150px;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: rgba(147, 51, 234, 0.3);
            bottom: -200px;
            left: -200px;
        }

        .loading-animation {
            margin: 2rem 0;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: bounce 1.5s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            .coming-soon-glass {
                padding: 2rem;
                margin: 1rem;
            }

            .coming-soon-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    
    <div class="coming-soon">
        <div class="coming-soon-glass">
            <h1 class="coming-soon-title">Coming Soon</h1>
            <p class="coming-soon-text">
                I'm working on something awesome! This case study is currently under development and will be available soon.
                Stay tuned for an in-depth analysis of this exciting project.
            </p>
            <div class="loading-animation">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <a href="index.html#projects" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Back to Portfolio
            </a>
        </div>
    </div>
</body>
</html>
